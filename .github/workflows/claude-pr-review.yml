name: Claude PR Review

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  issue_comment:
    types:
      - created

jobs:
  claude-review:
    if: >-
      secrets.ANTHROPIC_API_KEY != '' &&
      (
        (github.event_name == 'pull_request' && !github.event.pull_request.draft) ||
        (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '@claude review'))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout pull request branch
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout commented PR branch
        if: ${{ github.event_name == 'issue_comment' }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refs/pull/${{ github.event.issue.number }}/head

      - name: Run Claude review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          direct_prompt: |
            Review this pull request like a strict code reviewer.
            Prioritize bugs, regressions, missing tests, risky UIKit or media-player changes,
            SDK misuse, and edge cases around chorus sync / mute state / SEI timing.
            Keep findings concrete and actionable.
